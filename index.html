
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d20">
<title>AJIT AI — Smart Math Solver</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:radial-gradient(circle at top,#19356b,#080d20 65%);color:#f3f7ff;font-family:Arial,sans-serif;min-height:100vh}
.app{max-width:650px;margin:auto}
header{text-align:center;padding:20px 0}
.logo{width:76px;height:76px;margin:auto;border:2px solid #52d6ff;border-radius:24px;display:grid;place-items:center;font-size:32px;font-weight:bold;color:#65dcff;box-shadow:0 0 25px #168aff55;animation:float 3s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
h1{margin:15px 0 6px;letter-spacing:1px}
h1 span{color:#55d5ff}
.sub{color:#a8bddf;font-size:13px}
.panel{background:#101b33eF;border:1px solid #29466e;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 12px 30px #0003}
label{display:block;font-weight:bold;margin-bottom:12px}
textarea,input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #344b70;background:#080f23;color:white;font-size:16px;outline:none}
textarea{min-height:105px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:#52d6ff}
button{border:0;border-radius:12px;padding:13px;font-weight:bold;font-size:15px;cursor:pointer}
.primary{background:linear-gradient(100deg,#1677ff,#20c7e8);color:white;width:100%;margin-top:12px}
.secondary{background:#203253;color:#e4efff}
.actions{display:flex;gap:10px;margin-top:10px}
.actions button{flex:1}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.examples button{font-size:13px;padding:9px}
#result{display:none;line-height:1.8;overflow-wrap:anywhere}
.answer{font-size:25px;color:#66e2ff;font-weight:bold;margin:8px 0}
.steps{white-space:pre-wrap;color:#d8e6ff}
.note{color:#9eb4d8;font-size:12px;line-height:1.6}
footer{text-align:center;color:#8298bd;font-size:12px;padding:15px}
</style>
</head>
<body>
<main class="app">
<header>
<div class="logo">A∑</div>
<h1>AJIT <span>AI</span></h1>
<div class="sub">SMART MATH SOLVER • CLASS 6–12</div>
</header>

<section class="panel">
<label for="question">🧮 अपना Maths सवाल लिखो</label>
<textarea id="question" placeholder="उदाहरण: 25 × 16&#10;200 का 15%&#10;√144&#10;2x + 5 = 15"></textarea>
<div class="examples">
<button class="secondary" data-q="25 × 16">गुणा</button>
<button class="secondary" data-q="200 का 15%">प्रतिशत</button>
<button class="secondary" data-q="√144">वर्गमूल</button>
<button class="secondary" data-q="2x + 5 = 15">समीकरण</button>
<button class="secondary" data-q="(12 + 8) × 3">BODMAS</button>
</div>
<button class="primary" id="solve">✦ सवाल हल करो</button>
<div class="actions">
<button class="secondary" id="clear">साफ करो</button>
<button class="secondary" id="copy">उत्तर कॉपी</button>
</div>
<p class="note">यह मुफ्त, ब्राउज़र-आधारित सॉल्वर है। कठिन शब्द-प्रश्न और सभी गणितीय विषय अभी समर्थित नहीं हैं।</p>
</section>

<section class="panel" id="result">
<h3>✅ समाधान</h3>
<div id="answer" class="answer"></div>
<div id="steps" class="steps"></div>
</section>
<footer>AJIT AI • Made with ❤️ by Ajit</footer>
</main>

<script>
const $=id=>document.getElementById(id);
let lastAnswer="";

function fmt(n){
 if(!Number.isFinite(n))throw Error("उत्तर परिमित संख्या नहीं है।");
 return Number(n.toPrecision(12)).toString();
}
function tokenize(s){
 let out=[],i=0;
 while(i<s.length){
  if(/\s/.test(s[i])){i++;continue}
  let m=s.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);
  if(m){out.push({t:"n",v:Number(m[0])});i+=m[0].length;continue}
  if("+-*/^()%".includes(s[i])){out.push({t:s[i++]});continue}
  throw Error("अभिव्यक्ति में अनजान चिन्ह है। सवाल को जाँचें।");
 }
 return out;
}
function calc(s){
 let a=tokenize(s),p=0;
 function expr(){let v=term();while(a[p]&&["+","+ -"].includes(a[p].t)){let o=a[p++].t,r=term();v=o==="+"?v+r:v-r}return v}
 function term(){let v=unary();while(a[p]&&["*","/","%"].includes(a[p].t)){let o=a[p++].t,r=unary();if((o==="/"||o==="%")&&r===0)throw Error("शून्य से भाग नहीं दे सकते।");v=o==="*"?v*r:o==="/"?v/r:v%r}return v}
 function unary(){if(a[p]?.t==="+"){p++;return unary()}if(a[p]?.t==="-"){p++;return -unary()}return power()}
 function power(){let v=atom();if(a[p]?.t==="^"){p++;v=Math.pow(v,unary())}return v}
 function atom(){
  let x=a[p++];
  if(!x)throw Error("सवाल अधूरा है।");
  if(x.t==="n")return x.v;
  if(x.t==="("){let v=expr();if(a[p++]?.t!==")")throw Error("बंद कोष्ठक ) लगाएँ।");return v}
  throw Error("गणितीय अभिव्यक्ति जाँचें।");
 }
 if(!a.length)throw Error("पहले सवाल लिखें।");
 let v=expr();
 if(p!==a.length)throw Error("सवाल की बनावट जाँचें।");
 return v;
}
function equation(s){
 let sides=s.split("=");
 if(sides.length!==2)throw Error("समीकरण में एक = चिन्ह होना चाहिए।");
 function linear(str){
  str=str.replace(/−/g,"-").replace(/\s/g,"");
  if(!str)throw Error("समीकरण अधूरा है।");
  let tokens=str.match(/[+-]?[^+-]+/g);
  let A=0,B=0;
  for(let token of tokens){
   let sign=1;
   if(token[0]==="-"){sign=-1;token=token.slice(1)}
   else if(token[0]==="+")token=token.slice(1);
   if(!token)continue;
   if(token.includes("x")){
    let c=token.replace("x","");
    if(c.includes("*"))c=c.replace("*","");
    if(c==="")A+=sign;
    else A+=sign*(c===""?1:Number(c));
   }else B+=sign*calc(token);
  }
  return [A,B];
 }
 let [a,b]=linear(sides[0]),[c,d]=linear(sides[1]);
 let coefficient=a-c,constant=d-b;
 if(Math.abs(coefficient)<1e-12){
  if(Math.abs(constant)<1e-12)throw Error("इस समीकरण के अनंत हल हैं।");
  throw Error("इस समीकरण का कोई हल नहीं है।");
 }
 let x=constant/coefficient;
 return {answer:"x = "+fmt(x),steps:"1. समीकरण: "+s+"\n2. x वाले पद एक तरफ और संख्याएँ दूसरी तरफ लाएँ।\n3. x का गुणांक = "+fmt(coefficient)+"\n4. दूसरी तरफ की संख्या = "+fmt(constant)+"\n5. x = "+fmt(constant)+" ÷ "+fmt(coefficient)+"\n6. अंतिम उत्तर: x = "+fmt(x)};
}
function solve(s){
 let original=s;
 s=s.replace(/−/g,"-").replace(/[×✕]/g,"*").replace(/[÷]/g,"/");
 let percent=s.match(/^\s*(\d+(?:\.\d+)?)\s*(?:का|की|का\s)?\s*(\d+(?:\.\d+)?)\s*%\s*$/);
 if(percent){
  let base=Number(percent[1]),p=Number(percent[2]);
  return {answer:fmt(base*p/100),steps:"1. "+base+" का "+p+"%\n2. प्रतिशत = संख्या × प्रतिशत ÷ 100\n3. "+base+" × "+p+" ÷ 100\n4. उत्तर = "+fmt(base*p/100)};
 }
 let percent2=s.match(/^\s*(\d+(?:\.\d+)?)\s*%\s*(?:of|का)\s*(\d+(?:\.\d+)?)\s*$/i);
 if(percent2){let p=+percent2[1],b=+percent2[2];return {answer:fmt(p*b/100),steps:p+"% × "+b+" = "+p+" × "+b+" ÷ 100"}}
 let root=s.match(/^\s*(?:√|sqrt\s*\(?\s*)(-?\d+(?:\.\d+)?)\)?\s*$/i);
 if(root){
  let n=+root[1];if(n<0)throw Error("इस Solver में ऋणात्मक संख्या का वास्तविक वर्गमूल उपलब्ध नहीं है।");
  let v=Math.sqrt(n);return {answer:fmt(v),steps:"1. संख्या = "+n+"\n2. ऐसा मान खोजें जिसका वर्ग "+n+" हो।\n3. √"+n+" = "+fmt(v)};
 }
 if(s.includes("=")&&/[xX]/.test(s))return equation(s.replace(/X/g,"x"));
 let normalized=s.replace(/(\d)\s*[xX]\b/g,"$1*x").replace(/\b[xX]\s*(\d)/g,"x*$1");
 if(/[a-zA-Wy-zA-W]/i.test(normalized))throw Error("यह Solver अभी सामान्य गणितीय अभिव्यक्ति और x वाले सरल समीकरण समझता है।");
 let ans=calc(normalized);
 return {answer:fmt(ans),steps:"1. सवाल: "+original+"\n2. BODMAS के क्रम में गणना की गई।\n3. अंतिम उत्तर = "+fmt(ans)};
}
$("solve").onclick=()=>{
 try{
  let s=$("question").value.trim();
  if(!s)throw Error("पहले सवाल लिखें।");
  let r=solve(s);
  lastAnswer=r.answer;
  $("answer").textContent=r.answer;
  $("steps").textContent=r.steps;
  $("result").style.display="block";
 }catch(e){
  lastAnswer="";
  $("answer").textContent="सवाल हल नहीं हुआ";
  $("steps").textContent=e.message;
  $("result").style.display="block";
 }
};
$("clear").onclick=()=>{$("question").value="";$("result").style.display="none";lastAnswer="";};
$("copy").onclick=async()=>{
 if(!lastAnswer){alert("पहले सवाल हल करें।");return}
 try{await navigator.clipboard.writeText(lastAnswer);alert("उत्तर कॉपी हो गया!")}
 catch(e){alert("उत्तर: "+lastAnswer)}
};
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{$("question").value=b.dataset.q;$("question").focus()});
$("question").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")$("solve").click()});
</script>
</body>
</html>
