

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>MIND Calculator</title>
<style>
:root {
  --bg:#080b18;
  --panel:rgba(19,25,48,.88);
  --line:rgba(119,145,255,.19);
  --blue:#58d8ff;
  --purple:#9b7bff;
  --text:#f2f5ff;
  --muted:#8995b8;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:22px 12px;
  font-family:Inter,system-ui,Arial,sans-serif;color:var(--text);
  background:
    radial-gradient(ellipse at 10% 0%,#182d57 0,transparent 40%),
    radial-gradient(ellipse at 100% 70%,#291747 0,transparent 40%),
    var(--bg);
  display:flex;justify-content:center;align-items:center;
}
.app{width:100%;max-width:440px}
.brand{text-align:center;margin-bottom:20px}
.logo{
  width:64px;height:64px;margin:0 auto 10px;border-radius:20px;
  display:grid;place-items:center;font-size:30px;font-weight:900;
  color:white;background:linear-gradient(135deg,#43d9ff,#7257ff);
  box-shadow:0 0 35px #4b9dff55;transform:rotate(-5deg);
}
h1{margin:0;font-size:32px;letter-spacing:5px}
.tagline{color:var(--muted);font-size:12px;margin-top:5px;letter-spacing:2px}
.calculator{
  border:1px solid var(--line);border-radius:28px;padding:17px;
  background:var(--panel);backdrop-filter:blur(18px);
  box-shadow:0 25px 80px #0007;
}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pill{
  border:1px solid var(--line);background:#ffffff08;color:var(--blue);
  padding:8px 13px;border-radius:12px;font-weight:700;cursor:pointer
}
.status{font-size:11px;color:var(--muted)}
.screen{
  min-height:115px;border-radius:19px;padding:17px;margin-bottom:15px;
  background:linear-gradient(135deg,#070c1b,#111a32);
  border:1px solid #ffffff0b;display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden
}
.expression{font-size:16px;color:var(--muted);min-height:25px;overflow-wrap:anywhere;text-align:right}
.result{font-size:clamp(30px,8vw,42px);font-weight:700;text-align:right;overflow-wrap:anywhere;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
button.key{
  min-width:0;height:53px;border-radius:15px;border:1px solid #ffffff0b;
  color:var(--text);background:#ffffff08;font-size:17px;font-weight:600;
  cursor:pointer;transition:transform .12s,filter .12s;
}
button.key:active{transform:scale(.95);filter:brightness(1.35)}
button.fn{color:var(--blue);background:#58d8ff0c}
button.op{color:#c1aaff;background:#9b7bff12}
button.danger{color:#ff9eae;background:#ff607c12}
button.equal{
  color:#07101d;background:linear-gradient(135deg,var(--blue),#a2f5ff);
  box-shadow:0 5px 20px #58d8ff22
}
.section-title{font-size:11px;letter-spacing:2px;color:var(--muted);margin:18px 2px 10px}
.trig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.trig button{height:43px;font-size:14px}
.footer{text-align:center;color:#667394;font-size:11px;margin-top:15px}
@media(max-width:360px){
  body{padding:12px 8px}
  .calculator{padding:12px}
  .grid{gap:6px}
  button.key{height:48px;font-size:15px}
  .trig{gap:6px}
}
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="logo">M</div>
    <h1>MIND</h1>
    <div class="tagline">SMART • FAST • PRECISE</div>
  </header>

  <section class="calculator">
    <div class="topbar">
      <span class="status">CALCULATOR ENGINE</span>
      <button class="pill" id="mode" onclick="toggleMode()">DEG</button>
    </div>

    <div class="screen">
      <div class="expression" id="expression">Ready to calculate</div>
      <div class="result" id="result">0</div>
    </div>

    <div class="grid">
      <button class="key danger" onclick="clearAll()">AC</button>
      <button class="key fn" onclick="backspace()">DEL</button>
      <button class="key fn" onclick="put('(')">(</button>
      <button class="key op" onclick="put('/')">÷</button>

      <button class="key" onclick="put('7')">7</button>
      <button class="key" onclick="put('8')">8</button>
      <button class="key" onclick="put('9')">9</button>
      <button class="key op" onclick="put('*')">×</button>

      <button class="key" onclick="put('4')">4</button>
      <button class="key" onclick="put('5')">5</button>
      <button class="key" onclick="put('6')">6</button>
      <button class="key op" onclick="put('-')">−</button>

      <button class="key" onclick="put('1')">1</button>
      <button class="key" onclick="put('2')">2</button>
      <button class="key" onclick="put('3')">3</button>
      <button class="key op" onclick="put('+')">+</button>

      <button class="key fn" onclick="put('π')">π</button>
      <button class="key" onclick="put('0')">0</button>
      <button class="key" onclick="put('.')">.</button>
      <button class="key equal" onclick="calculate()">=</button>
    </div>

    <div class="section-title">SCIENTIFIC FUNCTIONS</div>
    <div class="trig">
      <button class="key fn" onclick="put('sin(')">sin</button>
      <button class="key fn" onclick="put('cos(')">cos</button>
      <button class="key fn" onclick="put('tan(')">tan</button>
      <button class="key fn" onclick="put('√(')">√</button>
      <button class="key fn" onclick="put('sin⁻¹(')">sin⁻¹</button>
      <button class="key fn" onclick="put('cos⁻¹(')">cos⁻¹</button>
      <button class="key fn" onclick="put('tan⁻¹(')">tan⁻¹</button>
      <button class="key fn" onclick="put('^2')">x²</button>
      <button class="key fn" onclick="put('log(')">log</button>
      <button class="key fn" onclick="put('ln(')">ln</button>
      <button class="key fn" onclick="put('!')">n!</button>
      <button class="key fn" onclick="put('%')">%</button>
    </div>
  </section>
  <div class="footer">MIND CALCULATOR · Runs on your device</div>
</main>

<script>
let expression = '';
let degreeMode = true;
const expEl = document.getElementById('expression');
const resultEl = document.getElementById('result');
const modeEl = document.getElementById('mode');

function show(){
  expEl.textContent = expression || 'Ready to calculate';
}
function put(value){
  if(expression === 'Error') expression = '';
  expression += value;
  show();
}
function clearAll(){
  expression = '';
  expEl.textContent = 'Ready to calculate';
  resultEl.textContent = '0';
}
function backspace(){
  expression = expression === 'Error' ? '' : expression.slice(0,-1);
  show();
}
function toggleMode(){
  degreeMode = !degreeMode;
  modeEl.textContent = degreeMode ? 'DEG' : 'RAD';
}
function factorial(n){
  if(!Number.isInteger(n) || n < 0 || n > 170) throw Error('Invalid factorial');
  let r = 1;
  for(let i=2;i<=n;i++) r *= i;
  return r;
}
function calculate(){
  if(!expression) return;
  try{
    let s = expression
      .replace(/π/g,'pi')
      .replace(/√\(/g,'sqrt(')
      .replace(/sin⁻¹\(/g,'asin(')
      .replace(/cos⁻¹\(/g,'acos(')
      .replace(/tan⁻¹\(/g,'atan(')
      .replace(/×/g,'*').replace(/÷/g,'/');

    const tokens = s.match(/(?:\d+\.?\d*|\.\d+)|(?:pi|sqrt|asin|acos|atan|sin|cos|tan|log|ln|abs)|[()+\-*/^%!]/gi);
    if(!tokens || tokens.join('') !== s.replace(/\s/g,'')) throw Error('Invalid input');
    let pos = 0;

    function peek(){return tokens[pos]}
    function eat(t){if(tokens[pos]===t){pos++;return true}return false}
    function primary(){
      if(eat('+')) return primary();
      if(eat('-')) return -primary();
      if(eat('(')){
        const v=add();
        if(!eat(')')) throw Error('Missing )');
        return v;
      }
      const t=peek();
      if(!t) throw Error('Incomplete');
      if(/^\d/.test(t)||/^\.\d/.test(t)){
        pos++;return Number(t);
      }
      if(/^pi$/i.test(t)){pos++;return Math.PI}
      if(/^[a-z]+$/i.test(t)){
        pos++;
        if(!eat('(')) throw Error('Use parentheses');
        const x=add();
        if(!eat(')')) throw Error('Missing )');
        const angle=degreeMode?x*Math.PI/180:x;
        switch(t.toLowerCase()){
          case 'sqrt': return Math.sqrt(x);
          case 'sin': return Math.sin(angle);
          case 'cos': return Math.cos(angle);
          case 'tan':
            if(Math.abs(Math.cos(angle))<1e-12) throw Error('Undefined');
            return Math.tan(angle);
          case 'asin': return degreeMode?Math.asin(x)*180/Math.PI:Math.asin(x);
          case 'acos': return degreeMode?Math.acos(x)*180/Math.PI:Math.acos(x);
          case 'atan': return degreeMode?Math.atan(x)*180/Math.PI:Math.atan(x);
          case 'log': return Math.log10(x);
          case 'ln': return Math.log(x);
          case 'abs': return Math.abs(x);
          default: throw Error('Unknown function');
        }
      }
      throw Error('Check expression');
    }
    function power(){
      let v=primary();
      if(eat('^')) v=Math.pow(v,power());
      while(eat('!')) v=factorial(v);
      return v;
    }
    function multiply(){
      let v=power();
      while(true){
        if(eat('*')) v*=power();
        else if(eat('/')) v/=power();
        else if(eat('%')) v%=power();
        else break;
      }
      return v;
    }
    function add(){
      let v=multiply();
      while(true){
        if(eat('+')) v+=multiply();
        else if(eat('-')) v-=multiply();
        else break;
      }
      return v;
    }
    const answer=add();
    if(pos!==tokens.length || !Number.isFinite(answer)) throw Error('Invalid result');
    expEl.textContent=expression+' =';
    resultEl.textContent=Number(answer.toPrecision(12)).toString();
  }catch(e){
    resultEl.textContent='Error';
  }
}
document.addEventListener('keydown',e=>{
  if(/^[0-9.+\-*/()%]$/.test(e.key)){put(e.key)}
  else if(e.key==='Enter'){calculate()}
  else if(e.key==='Backspace'){backspace()}
  else if(e.key==='Escape'){clearAll()}
});
</script>
</body>
</html>
