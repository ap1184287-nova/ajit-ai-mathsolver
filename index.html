

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080D1C">
<title>ARYABHAT CALCULATOR</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:18px 10px;
 display:flex;justify-content:center;align-items:center;
 font-family:Arial,sans-serif;color:#f2f6ff;
 background:radial-gradient(ellipse at top,#183765,#080d1c 65%);
}
.app{width:100%;max-width:390px}
.brand{text-align:center;margin-bottom:20px}
.logo{
 width:58px;height:58px;margin:auto auto 10px;
 display:grid;place-items:center;border-radius:18px;
 background:linear-gradient(135deg,#42dcff,#635bff);
 color:#061020;font-size:30px;font-weight:900;
 box-shadow:0 0 28px #38bfff55
}
h1{font-size:23px;letter-spacing:2px;margin:0}
.sub{font-size:10px;letter-spacing:3px;color:#8fa9d8;margin-top:7px}
.calc{
 padding:15px;border-radius:25px;
 background:#111a2df0;border:1px solid #5c9dff35;
 box-shadow:0 20px 55px #0007
}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.small{font-size:11px;color:#8fa2c9}
button{
 border:0;cursor:pointer;color:#f4f7ff;
 -webkit-tap-highlight-color:transparent;
 font-size:16px;font-weight:600
}
.mode{padding:8px 13px;border-radius:10px;background:#203355;color:#55d9ff}
.screen{
 min-height:105px;padding:15px;border-radius:17px;
 background:#080e1d;border:1px solid #ffffff0a;
 display:flex;flex-direction:column;justify-content:flex-end;
 margin-bottom:13px;overflow:hidden
}
#expression{color:#92a5cb;font-size:16px;text-align:right;overflow-wrap:anywhere;min-height:20px}
#result{font-size:35px;font-weight:700;text-align:right;margin-top:10px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.key{
 height:49px;border-radius:13px;background:#1b2740;
 border:1px solid #ffffff08
}
.key:active{filter:brightness(1.4);transform:scale(.97)}
.fn{background:#152e48;color:#55d9ff}
.op{background:#28244a;color:#c1aaff}
.clear{background:#422235;color:#ff9bb4}
.equal{background:linear-gradient(135deg,#4be0ff,#8b8aff);color:#07101e}
.label{font-size:10px;letter-spacing:2px;color:#8195bd;margin:17px 2px 9px}
.trig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.trig .key{height:42px;font-size:13px}
@media(max-width:340px){.calc{padding:10px}.grid,.trig{gap:5px}.key{height:44px;font-size:14px}}
</style>
</head>
<body>
<main class="app">
 <header class="brand">
  <div class="logo">A</div>
  <h1>ARYABHAT</h1>
  <div class="sub">CALCULATOR</div>
 </header>

 <section class="calc">
  <div class="top">
   <span class="small">SCIENTIFIC CALCULATOR</span>
   <button class="mode" id="mode" onclick="toggleMode()">DEG</button>
  </div>

  <div class="screen">
   <div id="expression">0</div>
   <div id="result">0</div>
  </div>

  <div class="grid">
   <button class="key clear" onclick="clearAll()">AC</button>
   <button class="key fn" onclick="del()">DEL</button>
   <button class="key fn" onclick="put('(')">(</button>
   <button class="key op" onclick="put('÷')">÷</button>

   <button class="key" onclick="put('7')">7</button>
   <button class="key" onclick="put('8')">8</button>
   <button class="key" onclick="put('9')">9</button>
   <button class="key op" onclick="put('×')">×</button>

   <button class="key" onclick="put('4')">4</button>
   <button class="key" onclick="put('5')">5</button>
   <button class="key" onclick="put('6')">6</button>
   <button class="key op" onclick="put('−')">−</button>

   <button class="key" onclick="put('1')">1</button>
   <button class="key" onclick="put('2')">2</button>
   <button class="key" onclick="put('3')">3</button>
   <button class="key op" onclick="put('+')">+</button>

   <button class="key fn" onclick="put('π')">π</button>
   <button class="key" onclick="put('0')">0</button>
   <button class="key" onclick="put('.')">.</button>
   <button class="key equal" onclick="calculate()">=</button>
  </div>

  <div class="label">TRIGONOMETRY</div>
  <div class="trig">
   <button class="key fn" onclick="put('sin(')">sin</button>
   <button class="key fn" onclick="put('cos(')">cos</button>
   <button class="key fn" onclick="put('tan(')">tan</button>
   <button class="key fn" onclick="put('√(')">√</button>
   <button class="key fn" onclick="put('asin(')">sin⁻¹</button>
   <button class="key fn" onclick="put('acos(')">cos⁻¹</button>
   <button class="key fn" onclick="put('atan(')">tan⁻¹</button>
   <button class="key fn" onclick="put('^2')">x²</button>
   <button class="key fn" onclick="put('log(')">log</button>
   <button class="key fn" onclick="put('ln(')">ln</button>
   <button class="key fn" onclick="put('%')">%</button>
   <button class="key fn" onclick="put('!')">n!</button>
  </div>
 </section>
</main>

<script>
let expr = '';
let degree = true;
const expBox = document.getElementById('expression');
const out = document.getElementById('result');

function render(){
 expBox.textContent = expr || '0';
}
function put(v){
 if(out.textContent === 'Error') out.textContent = '0';
 expr += v;
 render();
}
function clearAll(){
 expr = '';
 expBox.textContent = '0';
 out.textContent = '0';
}
function del(){
 expr = expr.slice(0,-1);
 render();
}
function toggleMode(){
 degree = !degree;
 document.getElementById('mode').textContent = degree ? 'DEG' : 'RAD';
}
function factorial(n){
 if(!Number.isInteger(n)||n<0||n>170) throw Error();
 let r=1;
 for(let i=2;i<=n;i++) r*=i;
 return r;
}

function calculate(){
 if(!expr) return;
 try{
  const s = expr
   .replace(/×/g,'*').replace(/÷/g,'/')
   .replace(/−/g,'-').replace(/π/g,'pi')
   .replace(/√/g,'sqrt');

  const tokens = s.match(/\d+(?:\.\d*)?|\.\d+|[a-z]+|[()+\-*/^%!]/gi);
  if(!tokens || tokens.join('') !== s.replace(/\s/g,'')) throw Error();
  let p=0;
  const peek=()=>tokens[p];
  const eat=x=>{if(peek()===x){p++;return true}return false};

  function primary(){
   if(eat('(')){
    const v=add();
    if(!eat(')')) throw Error();
    return v;
   }
   const t=peek();
   if(!t) throw Error();
   if(/^(?:\d|\.)/.test(t)){
    p++;return Number(t);
   }
   if(t.toLowerCase()==='pi'){
    p++;return Math.PI;
   }
   if(/^[a-z]+$/i.test(t)){
    p++;
    if(!eat('(')) throw Error();
    const x=add();
    if(!eat(')')) throw Error();
    const a=degree?x*Math.PI/180:x;
    switch(t.toLowerCase()){
     case 'sin':return Math.sin(a);
     case 'cos':return Math.cos(a);
     case 'tan':
      if(Math.abs(Math.cos(a))<1e-12) throw Error();
      return Math.tan(a);
     case 'asin':
      if(x < -1 || x > 1) throw Error();
      return degree?Math.asin(x)*180/Math.PI:Math.asin(x);
     case 'acos':
      if(x < -1 || x > 1) throw Error();
      return degree?Math.acos(x)*180/Math.PI:Math.acos(x);
     case 'atan':return degree?Math.atan(x)*180/Math.PI:Math.atan(x);
     case 'sqrt':if(x<0)throw Error();return Math.sqrt(x);
     case 'log':if(x<=0)throw Error();return Math.log10(x);
     case 'ln':if(x<=0)throw Error();return Math.log(x);
     default:throw Error();
    }
   }
   throw Error();
  }
  function unary(){
   if(eat('+')) return unary();
   if(eat('-')) return -unary();
   return primary();
  }
  function power(){
   let v=unary();
   if(eat('^')) v=Math.pow(v,power());
   return v;
  }
  function postfix(){
   let v=power();
   while(true){
    if(eat('!')) v=factorial(v);
    else if(eat('%')) v/=100;
    else break;
   }
   return v;
  }
  function multiply(){
   let v=postfix();
   while(true){
    if(eat('*')) v*=postfix();
    else if(eat('/')){
     const d=postfix();
     if(d===0) throw Error();
     v/=d;
    }else break;
   }
   return v;
  }
  function add(){
   let v=multiply();
   while(true){
    if(eat('+')) v+=multiply();
    else if(eat('-')) v-=multiply();
    else break;
   }
   return v;
  }

  const ans=add();
  if(p!==tokens.length||!Number.isFinite(ans)) throw Error();
  out.textContent=String(Number(ans.toPrecision(12)));
  expBox.textContent=expr+' =';
 }catch(e){
  out.textContent='Error';
 }
}
document.addEventListener('keydown',e=>{
 if(/^[0-9.]$/.test(e.key)) put(e.key);
 else if(e.key==='+') put('+');
 else if(e.key==='-') put('−');
 else if(e.key==='*') put('×');
 else if(e.key==='/') put('÷');
 else if(e.key==='('||e.key===')'||e.key==='%'||e.key==='^'||e.key==='!') put(e.key);
 else if(e.key==='Enter') calculate();
 else if(e.key==='Backspace') del();
 else if(e.key==='Escape') clearAll();
});
</script>
</body>
</html>
