<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJIT SURFERS PRO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030816;color:white;
 font-family:Arial;text-align:center
}
header{padding:24px;color:#00eaff;font-size:25px;font-weight:bold}
#game{
 height:55vh;min-height:300px;margin:10px;
 background:linear-gradient(#071426,#12345a);
 border:2px solid #078bff;border-radius:18px;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column
}
button{
 background:#087fff;color:white;border:0;
 padding:16px 24px;border-radius:12px;
 font-size:18px;font-weight:bold;margin:8px
}
#player{font-size:55px}
#status{font-size:18px;color:#00eaff}
</style>
</head>
<body>
<header>⚡ AJIT SURFERS PRO ⚡</header>
<div id="game">
 <div id="player">🏃</div>
 <h2 id="status">READY TO RUN?</h2>
 <p id="score">SCORE: 0</p>
</div>
<button id="play">▶ PLAY NOW</button>
<button id="jump">⬆ JUMP</button>
<button id="left">◀ LEFT</button>
<button id="right">RIGHT ▶</button>
<script>
let started=false,score=0,x=0,timer;
const player=document.getElementById('player');
const status=document.getElementById('status');
document.getElementById('play').onclick=()=>{
 if(started)return;
 started=true;
 status.textContent='GAME STARTED!';
 timer=setInterval(()=>{
  score++;
  document.getElementById('score').textContent='SCORE: '+score;
 },500);
};
document.getElementById('jump').onclick=()=>{
 if(started){
  player.style.transform='translateY(-65px)';
  setTimeout(()=>player.style.transform='translateY(0)',350);
 }
};
document.getElementById('left').onclick=()=>{
 if(started&&x>-1){x--;player.style.marginLeft=(x*55)+'px'}
};
document.getElementById('right').onclick=()=>{
 if(started&&x<1){x++;player.style.marginLeft=(x*55)+'px'}
};
</script>
</body>
</html>
